<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f766e" />
    <title>目前無法連線｜888desturl</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #101828;
        background: #f8fafc;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at top left, rgba(20, 184, 166, 0.2), transparent 34%),
          linear-gradient(180deg, #f8fafc 0%, #eef2ff 100%);
      }

      main {
        width: min(100%, 520px);
        padding: 40px;
        border: 1px solid rgba(255, 255, 255, 0.75);
        border-radius: 32px;
        background: rgba(255, 255, 255, 0.9);
        box-shadow: 0 24px 80px rgba(15, 23, 42, 0.14);
        text-align: center;
      }

      img {
        width: 88px;
        height: 88px;
        border-radius: 22px;
      }

      h1 {
        margin: 24px 0 12px;
        font-size: clamp(1.8rem, 7vw, 2.5rem);
        letter-spacing: -0.04em;
      }

      p {
        margin: 0 auto;
        max-width: 38ch;
        color: #475569;
        line-height: 1.7;
      }

      button {
        min-height: 48px;
        margin-top: 28px;
        padding: 0 22px;
        border: 0;
        border-radius: 16px;
        color: white;
        background: #101828;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" width="88" height="88" />
      <h1>目前無法連線</h1>
      <p>網址追蹤需要網路連線。確認連線恢復後，請再試一次。</p>
      <button type="button" onclick="window.location.reload()">重新連線</button>
    </main>
  </body>
</html>
