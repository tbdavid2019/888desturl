[package]
name = "pdf-text"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
pdf_oxide = { version = "0.3.78", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
lopdf = "0.45"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
